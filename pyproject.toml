[tool.poetry]
name = "prepa"
version = "0.1.0"
description = ""
authors = ["Zakaria Sriti <zsriti@athoria.fr>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
pydantic = "^2"
pyyaml = "^6.0.3"
anthropic = "^1.15.0"
llama-cpp-python = "^0.3.36"

[tool.poetry.group.dev.dependencies]
